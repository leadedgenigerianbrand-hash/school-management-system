<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academic Terms | School Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;
            color: #1f2937;
        }

        .page-container {
            width: 100%;
            min-height: 100vh;
        }

        /* HEADER */

        .page-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .page-title h1 {
            font-size: 25px;
            margin-bottom: 6px;
        }

        .page-title p {
            color: #6b7280;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-danger {
            background: #dc2626;
            color: #ffffff;
        }

        .btn-success {
            background: #16a34a;
            color: #ffffff;
        }

        .btn-warning {
            background: #d97706;
            color: #ffffff;
        }

        /* CONTENT */

        .content {
            padding: 25px 30px;
        }

        /* STATISTICS */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4,
                    minmax(0, 1fr));

            gap: 18px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
        }

        .stat-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 27px;
            font-weight: 700;
        }

        /* TOOLBAR */

        .toolbar {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;

            padding: 18px;

            margin-bottom: 20px;

            display: flex;
            flex-wrap: wrap;

            align-items: center;

            gap: 12px;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
        }

        .search-box input,
        .toolbar select {
            width: 100%;
            height: 42px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            padding: 0 12px;

            font-size: 14px;

            outline: none;
        }

        .search-box input:focus,
        .toolbar select:focus,
        input:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        .filter-box {
            width: 180px;
        }

        /* TABLE */

        .table-card {
            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            overflow: hidden;
        }

        .table-header {
            padding: 18px 20px;

            border-bottom: 1px solid #e5e7eb;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .table-header h2 {
            font-size: 17px;
        }

        .table-count {
            font-size: 13px;
            color: #6b7280;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 14px 16px;

            text-align: left;

            border-bottom:
                1px solid #e5e7eb;

            font-size: 14px;
        }

        th {
            background: #f9fafb;

            color: #374151;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 0.4px;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .term-name {
            font-weight: 600;
        }

        .session-name {
            color: #4b5563;
        }

        /* STATUS */

        .status {
            display: inline-flex;

            align-items: center;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;

            text-transform: capitalize;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-upcoming {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-completed {
            background: #f3f4f6;
            color: #374151;
        }

        .status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        /* ACTIONS */

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .action-btn {
            padding: 7px 10px;

            border-radius: 5px;

            font-size: 12px;

            font-weight: 600;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .activate-btn {
            background: #dcfce7;
            color: #166534;
        }

        /* EMPTY STATE */

        .empty-state {
            text-align: center;

            padding: 60px 20px;

            color: #6b7280;
        }

        .empty-state h3 {
            margin-bottom: 8px;

            color: #374151;
        }

        /* LOADING */

        .loading {
            text-align: center;

            padding: 40px;

            color: #6b7280;
        }

        /* MODAL */

        .modal-overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(0,
                    0,
                    0,
                    0.45);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;

            max-width: 650px;

            max-height: 90vh;

            overflow-y: auto;

            background: #ffffff;

            border-radius: 12px;

            box-shadow:
                0 20px 50px rgba(0,
                    0,
                    0,
                    0.2);
        }

        .modal-header {
            padding: 20px;

            border-bottom:
                1px solid #e5e7eb;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .modal-header h2 {
            font-size: 19px;
        }

        .close-btn {
            width: 34px;
            height: 34px;

            border-radius: 50%;

            background: #f3f4f6;

            color: #374151;

            font-size: 20px;
        }

        .modal-body {
            padding: 20px;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2,
                    minmax(0, 1fr));

            gap: 16px;
        }

        .form-group {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;

            font-weight: 600;

            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            padding: 10px 12px;

            font-family: inherit;

            font-size: 14px;

            outline: none;
        }

        textarea {
            min-height: 90px;

            resize: vertical;
        }

        .modal-footer {
            padding: 18px 20px;

            border-top:
                1px solid #e5e7eb;

            display: flex;

            justify-content: flex-end;

            gap: 10px;
        }

        /* ALERT */

        .alert {
            display: none;

            margin-bottom: 18px;

            padding: 13px 16px;

            border-radius: 7px;

            font-size: 14px;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2,
                        minmax(0, 1fr));
            }

            .page-header {
                align-items: flex-start;

                flex-direction: column;
            }

        }

        @media (max-width: 600px) {

            .content {
                padding: 18px;
            }

            .page-header {
                padding: 18px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .filter-box {
                width: 100%;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions .btn {
                flex: 1;
            }

        }
    </style>
</head>

<body>

    <div class="page-container">

        <!-- HEADER -->

        <header class="page-header">

            <div class="page-title">

                <h1>Academic Terms</h1>

                <p>
                    Manage first, second and third terms
                    for your school's academic sessions.
                </p>

            </div>

            <div class="header-actions">

                <button class="btn btn-primary" onclick="openCreateModal()">
                    + Add Term
                </button>

            </div>

        </header>


        <!-- MAIN CONTENT -->

        <main class="content">

            <!-- ALERT -->

            <div id="alert" class="alert"></div>


            <!-- STATISTICS -->

            <section class="stats-grid">

                <div class="stat-card">

                    <div class="stat-label">
                        Total Terms
                    </div>

                    <div id="totalTerms" class="stat-value">
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Active Terms
                    </div>

                    <div id="activeTerms" class="stat-value">
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Upcoming Terms
                    </div>

                    <div id="upcomingTerms" class="stat-value">
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Completed Terms
                    </div>

                    <div id="completedTerms" class="stat-value">
                        0
                    </div>

                </div>

            </section>


            <!-- TOOLBAR -->

            <section class="toolbar">

                <div class="search-box">

                    <input type="text" id="searchInput" placeholder="Search terms, sessions or codes..."
                        oninput="filterTerms()">

                </div>


                <div class="filter-box">

                    <select id="statusFilter" onchange="filterTerms()">

                        <option value="">
                            All Statuses
                        </option>

                        <option value="active">
                            Active
                        </option>

                        <option value="upcoming">
                            Upcoming
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <button class="btn btn-secondary" onclick="loadTerms()">
                    Refresh
                </button>

            </section>


            <!-- TABLE -->

            <section class="table-card">

                <div class="table-header">

                    <h2>
                        Academic Terms
                    </h2>

                    <span id="tableCount" class="table-count">
                        0 terms
                    </span>

                </div>


                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Term
                                </th>

                                <th>
                                    Code
                                </th>

                                <th>
                                    Academic Session
                                </th>

                                <th>
                                    Start Date
                                </th>

                                <th>
                                    End Date
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Actions
                                </th>

                            </tr>

                        </thead>

                        <tbody id="termsTableBody">

                            <tr>

                                <td colspan="7" class="loading">
                                    Loading terms...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <!-- CREATE / EDIT MODAL -->

    <div id="termModal" class="modal-overlay">

        <div class="modal">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Academic Term
                </h2>

                <button class="close-btn" onclick="closeModal()">
                    ×
                </button>

            </div>


            <form id="termForm" onsubmit="saveTerm(event)">

                <div class="modal-body">

                    <div class="form-grid">

                        <!-- SESSION -->

                        <div class="form-group">

                            <label for="sessionId">
                                Academic Session ID *
                            </label>

                            <input type="text" id="sessionId" required placeholder="Enter academic session ID">

                        </div>


                        <!-- TERM NAME -->

                        <div class="form-group">

                            <label for="termName">
                                Term Name *
                            </label>

                            <input type="text" id="termName" required placeholder="e.g. First Term">

                        </div>


                        <!-- TERM CODE -->

                        <div class="form-group">

                            <label for="termCode">
                                Term Code
                            </label>

                            <input type="text" id="termCode" placeholder="e.g. T1">

                        </div>


                        <!-- DISPLAY ORDER -->

                        <div class="form-group">

                            <label for="displayOrder">
                                Display Order
                            </label>

                            <input type="number" id="displayOrder" min="0" value="0">

                        </div>


                        <!-- START DATE -->

                        <div class="form-group">

                            <label for="startDate">
                                Start Date
                            </label>

                            <input type="date" id="startDate">

                        </div>


                        <!-- END DATE -->

                        <div class="form-group">

                            <label for="endDate">
                                End Date
                            </label>

                            <input type="date" id="endDate">

                        </div>


                        <!-- STATUS -->

                        <div class="form-group">

                            <label for="termStatus">
                                Status
                            </label>

                            <select id="termStatus">

                                <option value="upcoming">
                                    Upcoming
                                </option>

                                <option value="active">
                                    Active
                                </option>

                                <option value="completed">
                                    Completed
                                </option>

                                <option value="inactive">
                                    Inactive
                                </option>

                            </select>

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="form-group full">

                            <label for="description">
                                Description
                            </label>

                            <textarea id="description" placeholder="Optional description..."></textarea>

                        </div>

                    </div>

                </div>


                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" onclick="closeModal()">
                        Cancel
                    </button>

                    <button type="submit" class="btn btn-primary" id="saveButton">
                        Save Term
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script>

        /*
        |--------------------------------------------------------------------------
        | Configuration
        |--------------------------------------------------------------------------
        */

        const API_URL = "/api/terms";


        /*
        |--------------------------------------------------------------------------
        | Application State
        |--------------------------------------------------------------------------
        */

        let terms = [];

        let editingTermId = null;


        /*
        |--------------------------------------------------------------------------
        | Authentication Token
        |--------------------------------------------------------------------------
        */

        function getAuthToken() {

            return (
                localStorage.getItem("token") ||

                localStorage.getItem("authToken") ||

                localStorage.getItem("accessToken") ||

                ""
            );

        }


        /*
        |--------------------------------------------------------------------------
        | API Request Helper
        |--------------------------------------------------------------------------
        */

        async function apiRequest(
            url,
            options = {}
        ) {

            const token =
                getAuthToken();


            const headers = {

                "Content-Type":
                    "application/json",

                ...(options.headers || {})

            };


            if (token) {

                headers.Authorization =
                    `Bearer ${token}`;

            }


            const response =
                await fetch(
                    url,
                    {
                        ...options,
                        headers
                    }
                );


            let data = null;


            try {

                data =
                    await response.json();

            } catch (error) {

                data = null;

            }


            if (!response.ok) {

                const message =
                    data?.message ||
                    "Request failed.";

                throw new Error(
                    message
                );

            }


            return data;

        }


        /*
        |--------------------------------------------------------------------------
        | Load Terms
        |--------------------------------------------------------------------------
        */

        async function loadTerms() {

            const tbody =
                document.getElementById(
                    "termsTableBody"
                );


            tbody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="loading"
                >
                    Loading terms...
                </td>

            </tr>

        `;


            try {

                const response =
                    await apiRequest(
                        API_URL
                    );


                terms =
                    response?.data ||
                    response?.terms ||
                    response ||
                    [];


                if (!Array.isArray(terms)) {

                    terms = [];

                }


                updateStatistics();

                renderTerms(terms);

            } catch (error) {

                console.error(
                    "Load terms error:",
                    error
                );


                tbody.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="empty-state"
                    >

                        <h3>
                            Unable to load terms
                        </h3>

                        <p>
                            ${escapeHtml(error.message)}
                        </p>

                    </td>

                </tr>

            `;


                showAlert(
                    error.message,
                    "error"
                );

            }

        }


        /*
        |--------------------------------------------------------------------------
        | Render Terms
        |--------------------------------------------------------------------------
        */

        function renderTerms(
            list
        ) {

            const tbody =
                document.getElementById(
                    "termsTableBody"
                );


            document.getElementById(
                "tableCount"
            ).textContent =
                `${list.length} term${list.length === 1 ? "" : "s"}`;


            if (!list.length) {

                tbody.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="empty-state"
                    >

                        <h3>
                            No academic terms found
                        </h3>

                        <p>
                            Create your first academic term.
                        </p>

                    </td>

                </tr>

            `;

                return;

            }


            tbody.innerHTML =
                list.map(
                    term => {

                        const status =
                            String(
                                term.status ||
                                "upcoming"
                            ).toLowerCase();


                        const statusClass =
                            `status-${status}`;


                        return `

                        <tr>

                            <td>

                                <div class="term-name">

                                    ${escapeHtml(
                            term.term_name ||
                            term.termName ||
                            "-"
                        )}

                                </div>

                            </td>


                            <td>

                                ${escapeHtml(
                            term.term_code ||
                            term.termCode ||
                            "-"
                        )
                            }

                            </td>


                            <td>

                                <div class="session-name">

                                    ${escapeHtml(
                                term.session_name ||
                                term.sessionName ||
                                "-"
                            )
                            }

                                </div>

                            </td>


                            <td>

                                ${formatDate(
                                term.start_date ||
                                term.startDate
                            )
                            }

                            </td>


                            <td>

                                ${formatDate(
                                term.end_date ||
                                term.endDate
                            )
                            }

                            </td>


                            <td>

                                <span
                                    class="status ${statusClass}"
                                >

                                    ${escapeHtml(
                                status
                            )
                            }

                                </span>

                            </td>


                            <td>

                                <div class="actions">

                                    <button
                                        class="action-btn edit-btn"
                                        onclick="editTerm('${term.id}')"
                                    >
                                        Edit
                                    </button>


                                    ${status !== "active"
                                ?
                                `
                                            <button
                                                class="action-btn activate-btn"
                                                onclick="activateTerm('${term.id}')"
                                            >
                                                Activate
                                            </button>
                                        `
                                :
                                ""
                            }


                                    <button
                                        class="action-btn delete-btn"
                                        onclick="deleteTerm('${term.id}')"
                                    >
                                        Delete
                                    </button>

                                </div>

                            </td>

                        </tr>

                    `;

                    }
                ).join("");

        }


        /*
        |--------------------------------------------------------------------------
        | Update Statistics
        |--------------------------------------------------------------------------
        */

        function updateStatistics() {

            const total =
                terms.length;


            const active =
                terms.filter(
                    term =>
                        String(
                            term.status
                        ).toLowerCase()
                        === "active"
                ).length;


            const upcoming =
                terms.filter(
                    term =>
                        String(
                            term.status
                        ).toLowerCase()
                        === "upcoming"
                ).length;


            const completed =
                terms.filter(
                    term =>
                        String(
                            term.status
                        ).toLowerCase()
                        === "completed"
                ).length;


            document.getElementById(
                "totalTerms"
            ).textContent =
                total;


            document.getElementById(
                "activeTerms"
            ).textContent =
                active;


            document.getElementById(
                "upcomingTerms"
            ).textContent =
                upcoming;


            document.getElementById(
                "completedTerms"
            ).textContent =
                completed;

        }


        /*
        |--------------------------------------------------------------------------
        | Search / Filter
        |--------------------------------------------------------------------------
        */

        function filterTerms() {

            const search =
                document
                    .getElementById(
                        "searchInput"
                    )
                    .value
                    .trim()
                    .toLowerCase();


            const status =
                document
                    .getElementById(
                        "statusFilter"
                    )
                    .value
                    .toLowerCase();


            const filtered =
                terms.filter(
                    term => {

                        const text = [

                            term.term_name,

                            term.term_code,

                            term.session_name,

                            term.session_code,

                            term.description

                        ]
                            .filter(Boolean)
                            .join(" ")
                            .toLowerCase();


                        const matchesSearch =
                            !search ||
                            text.includes(search);


                        const matchesStatus =
                            !status ||
                            String(
                                term.status || ""
                            ).toLowerCase()
                            === status;


                        return (
                            matchesSearch &&
                            matchesStatus
                        );

                    }
                );


            renderTerms(
                filtered
            );

        }


        /*
        |--------------------------------------------------------------------------
        | Open Create Modal
        |--------------------------------------------------------------------------
        */

        function openCreateModal() {

            editingTermId = null;


            document.getElementById(
                "modalTitle"
            ).textContent =
                "Add Academic Term";


            document.getElementById(
                "saveButton"
            ).textContent =
                "Save Term";


            document.getElementById(
                "termForm"
            ).reset();


            document.getElementById(
                "displayOrder"
            ).value = 0;


            document.getElementById(
                "termStatus"
            ).value =
                "upcoming";


            document.getElementById(
                "termModal"
            ).classList.add(
                "show"
            );

        }


        /*
        |--------------------------------------------------------------------------
        | Open Edit Modal
        |--------------------------------------------------------------------------
        */

        function editTerm(
            termId
        ) {

            const term =
                terms.find(
                    item =>
                        String(item.id)
                        ===
                        String(termId)
                );


            if (!term) {

                showAlert(
                    "Term not found.",
                    "error"
                );

                return;

            }


            editingTermId =
                term.id;


            document.getElementById(
                "modalTitle"
            ).textContent =
                "Edit Academic Term";


            document.getElementById(
                "saveButton"
            ).textContent =
                "Update Term";


            document.getElementById(
                "sessionId"
            ).value =
                term.session_id ||
                term.sessionId ||
                "";


            document.getElementById(
                "termName"
            ).value =
                term.term_name ||
                term.termName ||
                "";


            document.getElementById(
                "termCode"
            ).value =
                term.term_code ||
                term.termCode ||
                "";


            document.getElementById(
                "startDate"
            ).value =
                toInputDate(
                    term.start_date ||
                    term.startDate
                );


            document.getElementById(
                "endDate"
            ).value =
                toInputDate(
                    term.end_date ||
                    term.endDate
                );


            document.getElementById(
                "description"
            ).value =
                term.description ||
                "";


            document.getElementById(
                "displayOrder"
            ).value =
                term.display_order ??
                term.displayOrder ??
                0;


            document.getElementById(
                "termStatus"
            ).value =
                term.status ||
                "upcoming";


            document.getElementById(
                "termModal"
            ).classList.add(
                "show"
            );

        }


        /*
        |--------------------------------------------------------------------------
        | Close Modal
        |--------------------------------------------------------------------------
        */

        function closeModal() {

            document.getElementById(
                "termModal"
            ).classList.remove(
                "show"
            );


            editingTermId = null;

        }


        /*
        |--------------------------------------------------------------------------
        | Save Term
        |--------------------------------------------------------------------------
        */

        async function saveTerm(
            event
        ) {

            event.preventDefault();


            const saveButton =
                document.getElementById(
                    "saveButton"
                );


            const payload = {

                sessionId:
                    document.getElementById(
                        "sessionId"
                    ).value.trim(),

                termName:
                    document.getElementById(
                        "termName"
                    ).value.trim(),

                termCode:
                    document.getElementById(
                        "termCode"
                    ).value.trim() ||
                    null,

                startDate:
                    document.getElementById(
                        "startDate"
                    ).value ||
                    null,

                endDate:
                    document.getElementById(
                        "endDate"
                    ).value ||
                    null,

                description:
                    document.getElementById(
                        "description"
                    ).value.trim() ||
                    null,

                displayOrder:
                    Number(
                        document.getElementById(
                            "displayOrder"
                        ).value || 0
                    ),

                status:
                    document.getElementById(
                        "termStatus"
                    ).value

            };


            if (!payload.sessionId) {

                showAlert(
                    "Academic session ID is required.",
                    "error"
                );

                return;

            }


            if (!payload.termName) {

                showAlert(
                    "Term name is required.",
                    "error"
                );

                return;

            }


            saveButton.disabled = true;

            saveButton.textContent =
                editingTermId
                    ?
                    "Updating..."
                    :
                    "Saving...";


            try {

                let response;


                if (editingTermId) {

                    response =
                        await apiRequest(
                            `${API_URL}/${editingTermId}`,
                            {
                                method: "PUT",
                                body:
                                    JSON.stringify(
                                        payload
                                    )
                            }
                        );

                } else {

                    response =
                        await apiRequest(
                            API_URL,
                            {
                                method: "POST",
                                body:
                                    JSON.stringify(
                                        payload
                                    )
                            }
                        );

                }


                showAlert(
                    response?.message ||
                    (
                        editingTermId
                            ?
                            "Term updated successfully."
                            :
                            "Term created successfully."
                    ),
                    "success"
                );


                closeModal();

                await loadTerms();

            } catch (error) {

                console.error(
                    "Save term error:",
                    error
                );


                showAlert(
                    error.message,
                    "error"
                );

            } finally {

                saveButton.disabled = false;

                saveButton.textContent =
                    editingTermId
                        ?
                        "Update Term"
                        :
                        "Save Term";

            }

        }


        /*
        |--------------------------------------------------------------------------
        | Activate Term
        |--------------------------------------------------------------------------
        */

        async function activateTerm(
            termId
        ) {

            const confirmed =
                confirm(
                    "Activate this term? Any currently active term in the same academic session may be completed automatically."
                );


            if (!confirmed) {
                return;
            }


            try {

                await apiRequest(
                    `${API_URL}/${termId}/activate`,
                    {
                        method: "PUT"
                    }
                );


                showAlert(
                    "Term activated successfully.",
                    "success"
                );


                await loadTerms();

            } catch (error) {

                console.error(
                    "Activate term error:",
                    error
                );


                showAlert(
                    error.message,
                    "error"
                );

            }

        }


        /*
        |--------------------------------------------------------------------------
        | Delete Term
        |--------------------------------------------------------------------------
        */

        async function deleteTerm(
            termId
        ) {

            const term =
                terms.find(
                    item =>
                        String(item.id)
                        ===
                        String(termId)
                );


            const termName =
                term?.term_name ||
                "this term";


            const confirmed =
                confirm(
                    `Are you sure you want to delete ${termName}? This action cannot be undone.`
                );


            if (!confirmed) {
                return;
            }


            try {

                await apiRequest(
                    `${API_URL}/${termId}`,
                    {
                        method: "DELETE"
                    }
                );


                showAlert(
                    "Term deleted successfully.",
                    "success"
                );


                await loadTerms();

            } catch (error) {

                console.error(
                    "Delete term error:",
                    error
                );


                showAlert(
                    error.message,
                    "error"
                );

            }

        }


        /*
        |--------------------------------------------------------------------------
        | Show Alert
        |--------------------------------------------------------------------------
        */

        function showAlert(
            message,
            type = "success"
        ) {

            const alert =
                document.getElementById(
                    "alert"
                );


            alert.textContent =
                message;


            alert.className =
                `alert show alert-${type}`;


            setTimeout(
                () => {

                    alert.classList.remove(
                        "show"
                    );

                },
                5000
            );

        }


        /*
        |--------------------------------------------------------------------------
        | Format Date
        |--------------------------------------------------------------------------
        */

        function formatDate(
            value
        ) {

            if (!value) {
                return "-";
            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return escapeHtml(
                    String(value)
                );

            }


            return date.toLocaleDateString(
                "en-NG",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        /*
        |--------------------------------------------------------------------------
        | Convert Date To Input Format
        |--------------------------------------------------------------------------
        */

        function toInputDate(
            value
        ) {

            if (!value) {
                return "";
            }


            const stringValue =
                String(value);


            if (
                /^\d{4}-\d{2}-\d{2}$/
                    .test(stringValue)
            ) {

                return stringValue;

            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            const year =
                date.getFullYear();


            const month =
                String(
                    date.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            const day =
                String(
                    date.getDate()
                ).padStart(
                    2,
                    "0"
                );


            return `${year}-${month}-${day}`;

        }


        /*
        |--------------------------------------------------------------------------
        | Escape HTML
        |--------------------------------------------------------------------------
        */

        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /*
        |--------------------------------------------------------------------------
        | Close Modal When Clicking Outside
        |--------------------------------------------------------------------------
        */

        document
            .getElementById(
                "termModal"
            )
            .addEventListener(
                "click",
                function (event) {

                    if (
                        event.target ===
                        this
                    ) {

                        closeModal();

                    }

                }
            );


        /*
        |--------------------------------------------------------------------------
        | Escape Key
        |--------------------------------------------------------------------------
        */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape"
                ) {

                    closeModal();

                }

            }
        );


        /*
        |--------------------------------------------------------------------------
        | Initial Load
        |--------------------------------------------------------------------------
        */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadTerms();

            }
        );

    </script>

</body>
