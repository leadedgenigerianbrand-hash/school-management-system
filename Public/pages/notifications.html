    </div>

    <script>

        let notifications = [];


        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadNotifications();

                document
                    .getElementById("notificationForm")
                    .addEventListener(
                        "submit",
                        createNotification
                    );

            }
        );


        function getAuthHeaders() {

            const token =
                localStorage.getItem("token") ||
                localStorage.getItem("accessToken") ||
                localStorage.getItem("jwt");

            const headers = {
                "Content-Type": "application/json"
            };

            if (token) {
                headers.Authorization =
                    "Bearer " + token;
            }

            return headers;
        }


        async function loadNotifications() {

            const list =
                document.getElementById(
                    "notificationList"
                );

            list.innerHTML = `
            <div class="loading">
                Loading notifications...
            </div>
        `;

            try {

                const response =
                    await fetch(
                        "/api/notifications",
                        {
                            method: "GET",
                            headers: getAuthHeaders()
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load notifications."
                    );

                }


                const result =
                    await response.json();


                notifications =
                    Array.isArray(result)
                        ? result
                        : (
                            result.data ||
                            result.notifications ||
                            []
                        );


                renderNotifications();

                updateSummary();

            } catch (error) {

                console.error(
                    "Load notifications error:",
                    error
                );


                list.innerHTML = `
                <div class="empty-state">
                    <h3>Unable to load notifications</h3>
                    <p>
                        No notification data could be loaded
                        from the server.
                    </p>
                </div>
            `;

                showMessage(
                    error.message,
                    "error"
                );

            }

        }


        function renderNotifications() {

            const list =
                document.getElementById(
                    "notificationList"
                );


            const filtered =
                getFilteredNotifications();


            document.getElementById(
                "notificationCount"
            ).textContent =
                `${filtered.length} notification${filtered.length === 1 ? "" : "s"}`;


            if (!filtered.length) {

                list.innerHTML = `
                <div class="empty-state">
                    <h3>No notifications found</h3>
                    <p>
                        There are no notifications matching
                        your current filters.
                    </p>
                </div>
            `;

                return;

            }


            list.innerHTML =
                filtered
                    .map(
                        notification =>
                            createNotificationHTML(
                                notification
                            )
                    )
                    .join("");

        }


        function createNotificationHTML(
            notification
        ) {

            const id =
                notification.id ||
                notification.notification_id ||
                "";


            const title =
                escapeHTML(
                    notification.title ||
                    notification.notification_title ||
                    "Notification"
                );


            const message =
                escapeHTML(
                    notification.message ||
                    notification.notification_message ||
                    notification.body ||
                    ""
                );


            const type =
                String(
                    notification.type ||
                    notification.notification_type ||
                    "info"
                ).toLowerCase();


            const isRead =
                notification.is_read === true ||
                notification.read === true ||
                notification.status === "read";


            const createdAt =
                notification.created_at ||
                notification.createdAt ||
                notification.date;


            const dateText =
                createdAt
                    ? formatDate(createdAt)
                    : "Recently";


            const icon =
                getNotificationIcon(type);


            const badgeClass =
                getBadgeClass(type);


            return `
            <article
                class="notification ${isRead ? "" : "unread"}"
                data-id="${escapeHTML(String(id))}"
            >

                <div class="notification-icon">
                    ${icon}
                </div>


                <div class="notification-content">

                    <div class="notification-title">
                        ${title}
                    </div>

                    <div class="notification-message">
                        ${message}
                    </div>

                    <div class="notification-meta">

                        <span>
                            ${dateText}
                        </span>

                        <span class="badge ${badgeClass}">
                            ${escapeHTML(type)}
                        </span>

                        <span>
                            ${isRead ? "Read" : "Unread"}
                        </span>

                    </div>

                </div>


                <div class="notification-actions">

                    ${!isRead
                    ? `
                                <button
                                    type="button"
                                    class="btn-secondary small-btn"
                                    onclick="markAsRead('${escapeHTML(String(id))}')"
                                >
                                    Mark Read
                                </button>
                            `
                    : ""
                }

                    ${id
                    ? `
                                <button
                                    type="button"
                                    class="btn-danger small-btn"
                                    onclick="deleteNotification('${escapeHTML(String(id))}')"
                                >
                                    Delete
                                </button>
                            `
                    : ""
                }

                </div>

            </article>
        `;

        }


        function getFilteredNotifications() {

            const search =
                document
                    .getElementById("searchInput")
                    .value
                    .trim()
                    .toLowerCase();


            const status =
                document
                    .getElementById("statusFilter")
                    .value;


            const type =
                document
                    .getElementById("typeFilter")
                    .value;


            return notifications.filter(
                notification => {

                    const title =
                        String(
                            notification.title ||
                            notification.notification_title ||
                            ""
                        ).toLowerCase();


                    const message =
                        String(
                            notification.message ||
                            notification.notification_message ||
                            notification.body ||
                            ""
                        ).toLowerCase();


                    const notificationType =
                        String(
                            notification.type ||
                            notification.notification_type ||
                            "info"
                        ).toLowerCase();


                    const isRead =
                        notification.is_read === true ||
                        notification.read === true ||
                        notification.status === "read";


                    const matchesSearch =
                        !search ||
                        title.includes(search) ||
                        message.includes(search);


                    const matchesStatus =
                        !status ||
                        (
                            status === "read"
                                ? isRead
                                : !isRead
                        );


                    const matchesType =
                        !type ||
                        notificationType === type;


                    return (
                        matchesSearch &&
                        matchesStatus &&
                        matchesType
                    );

                }
            );

        }


        function filterNotifications() {

            renderNotifications();

        }


        async function markAsRead(id) {

            if (!id) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/notifications/${encodeURIComponent(id)}/read`,
                        {
                            method: "PATCH",
                            headers: getAuthHeaders()
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to mark notification as read."
                    );

                }


                const notification =
                    notifications.find(
                        item =>
                            String(
                                item.id ||
                                item.notification_id
                            ) === String(id)
                    );


                if (notification) {

                    notification.is_read = true;
                    notification.read = true;
                    notification.status = "read";

                }


                renderNotifications();

                updateSummary();

            } catch (error) {

                console.error(
                    "Mark notification read error:",
                    error
                );

                showMessage(
                    error.message,
                    "error"
                );

            }

        }


        async function markAllAsRead() {

            try {

                const response =
                    await fetch(
                        "/api/notifications/read-all",
                        {
                            method: "PATCH",
                            headers: getAuthHeaders()
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to mark all notifications as read."
                    );

                }


                notifications.forEach(
                    notification => {

                        notification.is_read = true;
                        notification.read = true;
                        notification.status = "read";

                    }
                );


                renderNotifications();

                updateSummary();

                showMessage(
                    "All notifications marked as read.",
                    "success"
                );

            } catch (error) {

                console.error(
                    "Mark all notifications error:",
                    error
                );

                showMessage(
                    error.message,
                    "error"
                );

            }

        }


        async function deleteNotification(id) {

            if (!id) {
                return;
            }


            const confirmed =
                window.confirm(
                    "Are you sure you want to delete this notification?"
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/notifications/${encodeURIComponent(id)}`,
                        {
                            method: "DELETE",
                            headers: getAuthHeaders()
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to delete notification."
                    );

                }


                notifications =
                    notifications.filter(
                        notification =>
                            String(
                                notification.id ||
                                notification.notification_id
                            ) !== String(id)
                    );


                renderNotifications();

                updateSummary();

                showMessage(
                    "Notification deleted successfully.",
                    "success"
                );

            } catch (error) {

                console.error(
                    "Delete notification error:",
                    error
                );

                showMessage(
                    error.message,
                    "error"
                );

            }

        }


        function openNotificationModal() {

            document
                .getElementById(
                    "notificationModal"
                )
                .classList.add("show");

        }


        function closeNotificationModal() {

            document
                .getElementById(
                    "notificationModal"
                )
                .classList.remove("show");


            document
                .getElementById(
                    "notificationForm"
                )
                .reset();

        }


        async function createNotification(
            event
        ) {

            event.preventDefault();


            const title =
                document
                    .getElementById(
                        "notificationTitle"
                    )
                    .value
                    .trim();


            const type =
                document
                    .getElementById(
                        "notificationType"
                    )
                    .value;


            const message =
                document
                    .getElementById(
                        "notificationMessage"
                    )
                    .value
                    .trim();


            const recipient =
                document
                    .getElementById(
                        "notificationRecipient"
                    )
                    .value;


            if (!title || !message) {

                showMessage(
                    "Title and message are required.",
                    "error"
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        "/api/notifications",
                        {
                            method: "POST",
                            headers: getAuthHeaders(),
                            body: JSON.stringify({

                                title,
                                type,
                                message,
                                recipient

                            })
                        }
                    );


                if (!response.ok) {

                    const errorData =
                        await response
                            .json()
                            .catch(
                                () => ({})
                            );


                    throw new Error(
                        errorData.message ||
                        "Unable to create notification."
                    );

                }


                closeNotificationModal();

                await loadNotifications();

                showMessage(
                    "Notification created successfully.",
                    "success"
                );

            } catch (error) {

                console.error(
                    "Create notification error:",
                    error
                );

                showMessage(
                    error.message,
                    "error"
                );

            }

        }


        function updateSummary() {

            const total =
                notifications.length;


            const unread =
                notifications.filter(
                    notification =>
                        !(
                            notification.is_read === true ||
                            notification.read === true ||
                            notification.status === "read"
                        )
                ).length;


            const read =
                total - unread;


            const today =
                notifications.filter(
                    notification => {

                        const value =
                            notification.created_at ||
                            notification.createdAt ||
                            notification.date;


                        if (!value) {
                            return false;
                        }


                        const date =
                            new Date(value);


                        const now =
                            new Date();


                        return (
                            date.getFullYear() ===
                            now.getFullYear() &&
                            date.getMonth() ===
                            now.getMonth() &&
                            date.getDate() ===
                            now.getDate()
                        );

                    }
                ).length;


            document.getElementById(
                "totalNotifications"
            ).textContent = total;


            document.getElementById(
                "unreadNotifications"
            ).textContent = unread;


            document.getElementById(
                "readNotifications"
            ).textContent = read;


            document.getElementById(
                "todayNotifications"
            ).textContent = today;

        }


        function getNotificationIcon(type) {

            switch (type) {

                case "success":
                    return "✓";

                case "warning":
                    return "!";

                case "danger":
                    return "⚠";

                default:
                    return "i";

            }

        }


        function getBadgeClass(type) {

            switch (type) {

                case "success":
                    return "badge-success";

                case "warning":
                    return "badge-warning";

                case "danger":
                    return "badge-danger";

                default:
                    return "badge-info";

            }

        }


        function formatDate(value) {

            const date =
                new Date(value);


            if (Number.isNaN(date.getTime())) {
                return "Recently";
            }


            return date.toLocaleString(
                undefined,
                {
                    year: "numeric",
                    month: "short",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        function showMessage(
            text,
            type
        ) {

            const element =
                document.getElementById(
                    "message"
                );


            element.textContent = text;

            element.className =
                `message ${type}`;


            setTimeout(
                () => {

                    element.className =
                        "message";

                },
                4000
            );

        }


        function escapeHTML(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        window.addEventListener(
            "click",
            function (event) {

                const modal =
                    document.getElementById(
                        "notificationModal"
                    );


                if (
                    event.target === modal
                ) {

                    closeNotificationModal();

                }

            }
        );

    </script>

</body>

</html>
