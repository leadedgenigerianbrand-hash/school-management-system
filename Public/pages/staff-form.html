<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Form | School Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .page-wrapper {
            min-height: 100vh;
        }

        .topbar {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 28px;
        }

        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 20px 50px;
        }

        .form-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, .04);
        }

        .section {
            padding: 28px;
            border-bottom: 1px solid #e5e7eb;
        }

        .section:last-child {
            border-bottom: 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #111827;
        }

        .section-title i {
            color: #2563eb;
            margin-right: 8px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .required {
            color: #dc2626;
        }

        .form-control,
        .form-select {
            padding: 10px 12px;
            border-color: #d1d5db;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 .2rem rgba(37, 99, 235, .12);
        }

        textarea.form-control {
            min-height: 110px;
            resize: vertical;
        }

        .photo-preview {
            width: 125px;
            height: 125px;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .photo-placeholder {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
        }

        .photo-placeholder i {
            display: block;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .help-text {
            color: #6b7280;
            font-size: 12px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 22px 28px;
            background: #fafafa;
            border-radius: 0 0 12px 12px;
        }

        .loading {
            display: none;
        }

        @media (max-width: 767.98px) {
            .topbar {
                padding: 16px;
            }

            .main-content {
                padding: 18px 12px 35px;
            }

            .section {
                padding: 20px;
            }

            .form-actions {
                padding: 18px 20px;
                flex-direction: column-reverse;
            }

            .form-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="page-wrapper">

        <header class="topbar">

            <div class="container-fluid">

                <div class="d-flex justify-content-between align-items-center gap-3">

                    <div>
                        <h1 id="pageTitle" class="h3 fw-bold mb-1">
                            Add Staff
                        </h1>

                        <p class="text-secondary mb-0 small">
                            Create or update a staff member's information.
                        </p>
                    </div>

                    <a href="staff.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>
                        <span class="d-none d-sm-inline">Back to Staff</span>
                        <span class="d-inline d-sm-none">Back</span>
                    </a>

                </div>

            </div>

        </header>


        <main class="main-content">

            <div id="message" class="alert d-none" role="alert"></div>


            <div id="loading" class="loading alert alert-info">
                <span class="spinner-border spinner-border-sm me-2"></span>
                Loading staff information...
            </div>


            <div class="form-card">

                <form id="staffForm">

                    <!-- PHOTO -->

                    <section class="section">

                        <div class="section-title">
                            <i class="bi bi-camera"></i>
                            Staff Photo
                        </div>

                        <div class="d-flex flex-column flex-sm-row align-items-start gap-4">

                            <div class="photo-preview">

                                <div id="photoPlaceholder" class="photo-placeholder">
                                    <i class="bi bi-person"></i>
                                    No Photo
                                </div>

                                <img id="photoPreview" alt="Staff photo">

                            </div>

                            <div class="flex-grow-1">

                                <label for="photo" class="form-label">
                                    Staff Photo
                                </label>

                                <input type="file" id="photo" name="photo" class="form-control" accept="image/*">

                                <div class="help-text mt-2">
                                    Select a JPG, PNG or other image file.
                                </div>

                            </div>

                        </div>

                    </section>


                    <!-- PERSONAL INFORMATION -->

                    <section class="section">

                        <div class="section-title">
                            <i class="bi bi-person-vcard"></i>
                            Personal Information
                        </div>

                        <div class="row g-3">

                            <div class="col-md-6">

                                <label for="firstName" class="form-label">
                                    First Name
                                    <span class="required">*</span>
                                </label>

                                <input type="text" id="firstName" name="firstName" class="form-control" required
                                    autocomplete="given-name">

                            </div>


                            <div class="col-md-6">

                                <label for="lastName" class="form-label">
                                    Last Name
                                    <span class="required">*</span>
                                </label>

                                <input type="text" id="lastName" name="lastName" class="form-control" required
                                    autocomplete="family-name">

                            </div>


                            <div class="col-md-6">

                                <label for="middleName" class="form-label">
                                    Middle Name
                                </label>

                                <input type="text" id="middleName" name="middleName" class="form-control"
                                    autocomplete="additional-name">

                            </div>


                            <div class="col-md-6">

                                <label for="gender" class="form-label">
                                    Gender
                                </label>

                                <select id="gender" name="gender" class="form-select">

                                    <option value="">
                                        Select Gender
                                    </option>

                                    <option value="Male">
                                        Male
                                    </option>

                                    <option value="Female">
                                        Female
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label for="dateOfBirth" class="form-label">
                                    Date of Birth
                                </label>

                                <input type="date" id="dateOfBirth" name="dateOfBirth" class="form-control">

                            </div>


                            <div class="col-md-6">

                                <label for="phone" class="form-label">
                                    Phone Number
                                </label>

                                <input type="tel" id="phone" name="phone" class="form-control" autocomplete="tel"
                                    placeholder="08012345678">

                            </div>


                            <div class="col-md-6">

                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input type="email" id="email" name="email" class="form-control" autocomplete="email"
                                    placeholder="staff@example.com">

                            </div>


                            <div class="col-md-6">

                                <label for="address" class="form-label">
                                    Address
                                </label>

                                <input type="text" id="address" name="address" class="form-control"
                                    autocomplete="street-address">

                            </div>

                        </div>

                    </section>


                    <!-- EMPLOYMENT -->

                    <section class="section">

                        <div class="section-title">
                            <i class="bi bi-briefcase"></i>
                            Employment Information
                        </div>

                        <div class="row g-3">

                            <div class="col-md-6">

                                <label for="staffNumber" class="form-label">
                                    Staff Number
                                    <span class="required">*</span>
                                </label>

                                <input type="text" id="staffNumber" name="staffNumber" class="form-control" required
                                    placeholder="STAFF-001">

                                <div class="help-text mt-1">
                                    This must be unique within the school.
                                </div>

                            </div>


                            <div class="col-md-6">

                                <label for="departmentId" class="form-label">
                                    Department
                                </label>

                                <select id="departmentId" name="departmentId" class="form-select">

                                    <option value="">
                                        Select Department
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label for="jobTitle" class="form-label">
                                    Job Title
                                </label>

                                <input type="text" id="jobTitle" name="jobTitle" class="form-control"
                                    placeholder="Teacher">

                            </div>


                            <div class="col-md-6">

                                <label for="employmentType" class="form-label">
                                    Employment Type
                                </label>

                                <select id="employmentType" name="employmentType" class="form-select">

                                    <option value="">
                                        Select Employment Type
                                    </option>

                                    <option value="Permanent">
                                        Permanent
                                    </option>

                                    <option value="Contract">
                                        Contract
                                    </option>

                                    <option value="Part-time">
                                        Part-time
                                    </option>

                                    <option value="Temporary">
                                        Temporary
                                    </option>

                                    <option value="Intern">
                                        Intern
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label for="employmentDate" class="form-label">
                                    Employment Date
                                </label>

                                <input type="date" id="employmentDate" name="employmentDate" class="form-control">

                            </div>


                            <div class="col-md-6">

                                <label for="status" class="form-label">
                                    Status
                                </label>

                                <select id="status" name="status" class="form-select">

                                    <option value="active">
                                        Active
                                    </option>

                                    <option value="inactive">
                                        Inactive
                                    </option>

                                </select>

                            </div>

                        </div>

                    </section>


                    <!-- ADDITIONAL INFORMATION -->

                    <section class="section">

                        <div class="section-title">
                            <i class="bi bi-card-text"></i>
                            Additional Information
                        </div>

                        <div class="row g-3">

                            <div class="col-12">

                                <label for="qualification" class="form-label">
                                    Qualification
                                </label>

                                <textarea id="qualification" name="qualification" class="form-control"
                                    placeholder="Enter academic or professional qualifications..."></textarea>

                            </div>


                            <div class="col-12">

                                <label for="notes" class="form-label">
                                    Notes
                                </label>

                                <textarea id="notes" name="notes" class="form-control"
                                    placeholder="Additional information about this staff member..."></textarea>

                            </div>

                        </div>

                    </section>


                    <!-- ACTIONS -->

                    <div class="form-actions">

                        <button type="button" class="btn btn-outline-secondary" id="cancelButton">
                            <i class="bi bi-x-lg me-2"></i>
                            Cancel
                        </button>

                        <button type="submit" class="btn btn-primary" id="submitButton">
                            <i class="bi bi-check-lg me-2"></i>
                            Save Staff
                        </button>

                    </div>

                </form>

            </div>

        </main>

    </div>


    <script>

        (function () {

            "use strict";

            const form =
                document.getElementById("staffForm");

            const message =
                document.getElementById("message");

            const loading =
                document.getElementById("loading");

            const submitButton =
                document.getElementById("submitButton");

            const cancelButton =
                document.getElementById("cancelButton");

            const photoInput =
                document.getElementById("photo");

            const photoPreview =
                document.getElementById("photoPreview");

            const photoPlaceholder =
                document.getElementById("photoPlaceholder");

            const departmentSelect =
                document.getElementById("departmentId");

            let editingStaffId = null;


            function showMessage(text, type) {

                message.textContent = text;

                message.className =
                    "alert alert-" +
                    (type === "success" ? "success" : "danger");

            }


            function hideMessage() {

                message.textContent = "";

                message.className =
                    "alert d-none";

            }


            function setLoading(state) {

                loading.style.display =
                    state ? "block" : "none";

            }


            function getToken() {

                return (
                    localStorage.getItem("school_management_token") ||

                    sessionStorage.getItem("school_management_token") ||

                    localStorage.getItem("token") ||

                    localStorage.getItem("accessToken") ||

                    sessionStorage.getItem("token") ||

                    sessionStorage.getItem("accessToken") ||

                    ""
                );

            }


            function getHeaders() {

                const headers = {
                    "Content-Type": "application/json"
                };

                const token = getToken();

                if (token) {
                    headers.Authorization =
                        "Bearer " + token;
                }

                return headers;

            }


            async function parseResponse(response) {

                const text =
                    await response.text();

                if (!text) {
                    return {};
                }

                try {

                    return JSON.parse(text);

                } catch (error) {

                    throw new Error(
                        "Server returned an invalid response."
                    );

                }

            }


            async function loadDepartments() {

                try {

                    const response =
                        await fetch(
                            "/api/departments",
                            {
                                method: "GET",
                                headers: getHeaders()
                            }
                        );

                    if (!response.ok) {
                        return;
                    }

                    const result =
                        await parseResponse(response);

                    const departments =
                        Array.isArray(result)
                            ? result
                            : (
                                result.data ||
                                result.departments ||
                                []
                            );

                    departments.forEach(function (department) {

                        const option =
                            document.createElement("option");

                        option.value =
                            department.id;

                        option.textContent =
                            department.department_name ||

                            department.departmentName ||

                            department.name ||

                            "Department";

                        departmentSelect.appendChild(option);

                    });

                } catch (error) {

                    console.error(
                        "Department loading error:",
                        error
                    );

                }

            }


            function getStaffId() {

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                return (
                    params.get("id") ||
                    params.get("staffId")
                );

            }


            function setValue(id, value) {

                const element =
                    document.getElementById(id);

                if (!element) {
                    return;
                }

                element.value =
                    value === null ||
                        value === undefined
                        ? ""
                        : value;

            }


            function populateForm(staff) {

                setValue(
                    "staffNumber",
                    staff.staff_number ||
                    staff.staffNumber
                );

                setValue(
                    "firstName",
                    staff.first_name ||
                    staff.firstName
                );

                setValue(
                    "lastName",
                    staff.last_name ||
                    staff.lastName
                );

                setValue(
                    "middleName",
                    staff.middle_name ||
                    staff.middleName
                );

                setValue(
                    "gender",
                    staff.gender
                );

                setValue(
                    "dateOfBirth",
                    staff.date_of_birth ||
                    staff.dateOfBirth
                );

                setValue(
                    "phone",
                    staff.phone ||
                    staff.phone_number ||
                    staff.phoneNumber
                );

                setValue(
                    "email",
                    staff.email
                );

                setValue(
                    "address",
                    staff.address
                );

                setValue(
                    "departmentId",
                    staff.department_id ||
                    staff.departmentId
                );

                setValue(
                    "jobTitle",
                    staff.job_title ||
                    staff.jobTitle
                );

                setValue(
                    "employmentType",
                    staff.employment_type ||
                    staff.employmentType
                );

                setValue(
                    "employmentDate",
                    staff.employment_date ||
                    staff.employmentDate
                );

                setValue(
                    "status",
                    staff.status || "active"
                );

                setValue(
                    "qualification",
                    staff.qualification
                );

                setValue(
                    "notes",
                    staff.notes
                );

                const photo =
                    staff.photo_url ||

                    staff.photoUrl ||

                    staff.photo ||

                    staff.profile_photo ||

                    staff.profilePhoto;

                if (photo) {

                    photoPreview.src = photo;

                    photoPreview.style.display =
                        "block";

                    photoPlaceholder.style.display =
                        "none";

                }

            }


            async function loadStaff(staffId) {

                setLoading(true);

                hideMessage();

                try {

                    const response =
                        await fetch(
                            "/api/staff/" +
                            encodeURIComponent(staffId),
                            {
                                method: "GET",
                                headers: getHeaders()
                            }
                        );

                    const result =
                        await parseResponse(response);

                    if (!response.ok) {

                        throw new Error(
                            result.message ||
                            "Unable to load staff information."
                        );

                    }

                    const staff =
                        result.data ||
                        result.staff ||
                        result;

                    populateForm(staff);

                    document.getElementById(
                        "pageTitle"
                    ).textContent =
                        "Edit Staff";

                    submitButton.innerHTML =
                        '<i class="bi bi-check-lg me-2"></i>Update Staff';

                } catch (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                } finally {

                    setLoading(false);

                }

            }


            function collectFormData() {

                return {

                    staffNumber:
                        document.getElementById(
                            "staffNumber"
                        ).value.trim(),

                    firstName:
                        document.getElementById(
                            "firstName"
                        ).value.trim(),

                    lastName:
                        document.getElementById(
                            "lastName"
                        ).value.trim(),

                    middleName:
                        document.getElementById(
                            "middleName"
                        ).value.trim() || null,

                    gender:
                        document.getElementById(
                            "gender"
                        ).value || null,

                    dateOfBirth:
                        document.getElementById(
                            "dateOfBirth"
                        ).value || null,

                    phone:
                        document.getElementById(
                            "phone"
                        ).value.trim() || null,

                    email:
                        document.getElementById(
                            "email"
                        ).value.trim() || null,

                    address:
                        document.getElementById(
                            "address"
                        ).value.trim() || null,

                    departmentId:
                        document.getElementById(
                            "departmentId"
                        ).value || null,

                    jobTitle:
                        document.getElementById(
                            "jobTitle"
                        ).value.trim() || null,

                    employmentType:
                        document.getElementById(
                            "employmentType"
                        ).value || null,

                    employmentDate:
                        document.getElementById(
                            "employmentDate"
                        ).value || null,

                    status:
                        document.getElementById(
                            "status"
                        ).value || "active",

                    qualification:
                        document.getElementById(
                            "qualification"
                        ).value.trim() || null,

                    notes:
                        document.getElementById(
                            "notes"
                        ).value.trim() || null

                };

            }


            async function saveStaff(data) {

                const url =
                    editingStaffId

                        ? "/api/staff/" +
                        encodeURIComponent(
                            editingStaffId
                        )

                        : "/api/staff";

                const method =
                    editingStaffId
                        ? "PUT"
                        : "POST";

                const response =
                    await fetch(
                        url,
                        {
                            method: method,
                            headers: getHeaders(),
                            body: JSON.stringify(data)
                        }
                    );

                const result =
                    await parseResponse(response);

                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Unable to save staff information."
                    );

                }

                return result;

            }


            form.addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    hideMessage();

                    const data =
                        collectFormData();

                    if (!data.staffNumber) {

                        showMessage(
                            "Staff number is required.",
                            "error"
                        );

                        return;

                    }

                    if (!data.firstName) {

                        showMessage(
                            "First name is required.",
                            "error"
                        );

                        return;

                    }

                    if (!data.lastName) {

                        showMessage(
                            "Last name is required.",
                            "error"
                        );

                        return;

                    }

                    submitButton.disabled = true;

                    submitButton.innerHTML =
                        '<span class="spinner-border spinner-border-sm me-2"></span>' +
                        (
                            editingStaffId
                                ? "Updating..."
                                : "Saving..."
                        );

                    try {

                        await saveStaff(data);

                        showMessage(
                            editingStaffId
                                ? "Staff information updated successfully."
                                : "Staff created successfully.",
                            "success"
                        );

                        setTimeout(
                            function () {

                                window.location.href =
                                    "staff.html";

                            },
                            1000
                        );

                    } catch (error) {

                        console.error(
                            "Save staff error:",
                            error
                        );

                        showMessage(
                            error.message ||
                            "Unable to save staff information.",
                            "error"
                        );

                        submitButton.disabled =
                            false;

                        submitButton.innerHTML =
                            editingStaffId
                                ? '<i class="bi bi-check-lg me-2"></i>Update Staff'
                                : '<i class="bi bi-check-lg me-2"></i>Save Staff';

                    }

                }
            );


            cancelButton.addEventListener(
                "click",
                function () {

                    window.location.href =
                        "staff.html";

                }
            );


            photoInput.addEventListener(
                "change",
                function () {

                    const file =
                        photoInput.files[0];

                    if (!file) {

                        photoPreview.style.display =
                            "none";

                        photoPlaceholder.style.display =
                            "block";

                        return;

                    }

                    const reader =
                        new FileReader();

                    reader.onload =
                        function (event) {

                            photoPreview.src =
                                event.target.result;

                            photoPreview.style.display =
                                "block";

                            photoPlaceholder.style.display =
                                "none";

                        };

                    reader.readAsDataURL(file);

                }
            );


            async function initialise() {

                editingStaffId =
                    getStaffId();

                await loadDepartments();

                if (editingStaffId) {

                    await loadStaff(
                        editingStaffId
                    );

                }

            }


            initialise();

        })();

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
