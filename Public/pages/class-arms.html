<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Class Arms | School Management System</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        .page-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .page-title h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .page-title p {
            margin: 0;
            color: #6b7280;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-success:hover {
            background: #15803d;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .stat-card h3 {
            margin: 0 0 8px;
            font-size: 14px;
            color: #6b7280;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
        }

        .toolbar {
            background: white;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #2563eb;
        }

        .filter-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-box select {
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            min-width: 170px;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        thead {
            background: #f8fafc;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        th {
            color: #374151;
            font-weight: 700;
        }

        td {
            color: #4b5563;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .class-name {
            font-weight: 700;
            color: #111827;
        }

        .arm-name {
            font-weight: 600;
            color: #374151;
        }

        .arm-code {
            font-family: monospace;
            color: #6b7280;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 7px 10px;
            font-size: 12px;
        }

        .empty-state {
            padding: 50px 20px;
            text-align: center;
            color: #6b7280;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            color: #374151;
        }

        .loading {
            padding: 50px;
            text-align: center;
            color: #6b7280;
        }

        .alert {
            display: none;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 21px;
        }

        .close-modal {
            background: transparent;
            color: #6b7280;
            font-size: 24px;
            padding: 2px 8px;
        }

        .modal-body {
            padding: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
        }

        .modal-footer {
            padding: 18px 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .student-count {
            font-weight: 600;
            color: #374151;
        }

        @media (max-width: 900px) {

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .page-container {
                padding: 15px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .page-title h1 {
                font-size: 23px;
            }

        }
    </style>

</head>


<body>


    <div class="page-container">


        <!-- PAGE HEADER -->

        <div class="page-header">

            <div class="page-title">

                <h1>
                    Class Arms
                </h1>

                <p>
                    Manage class arms such as JSS 1A, JSS 1B and SS 2A.
                </p>

            </div>


            <div class="header-actions">

                <button type="button" class="btn-primary" id="addClassArmBtn">
                    + Add Class Arm
                </button>

            </div>

        </div>


        <!-- ALERT -->

        <div id="alertMessage" class="alert"></div>


        <!-- STATISTICS -->

        <div class="stats-grid">

            <div class="stat-card">

                <h3>
                    Total Class Arms
                </h3>

                <div class="value" id="totalClassArms">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Active Class Arms
                </h3>

                <div class="value" id="activeClassArms">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Inactive Class Arms
                </h3>

                <div class="value" id="inactiveClassArms">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Students Assigned
                </h3>

                <div class="value" id="studentsAssigned">
                    0
                </div>

            </div>

        </div>


        <!-- TOOLBAR -->

        <div class="toolbar">

            <div class="search-box">

                <input type="search" id="searchInput" placeholder="Search class arms..." autocomplete="off">

            </div>


            <div class="filter-box">

                <select id="classFilter">

                    <option value="">
                        All Classes
                    </option>

                </select>


                <select id="statusFilter">

                    <option value="">
                        All Statuses
                    </option>

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                </select>

            </div>

        </div>


        <!-- CLASS ARMS TABLE -->

        <div class="table-container">

            <div id="loadingState" class="loading">
                Loading class arms...
            </div>


            <table id="classArmsTable" style="display: none;">

                <thead>

                    <tr>

                        <th>
                            Class
                        </th>

                        <th>
                            Arm
                        </th>

                        <th>
                            Arm Code
                        </th>

                        <th>
                            Capacity
                        </th>

                        <th>
                            Students
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="classArmsTableBody">

                </tbody>

            </table>


            <div id="emptyState" class="empty-state" style="display: none;">

                <h3>
                    No Class Arms Found
                </h3>

                <p>
                    Create a class arm to get started.
                </p>

            </div>

        </div>


    </div>


    <!-- ADD / EDIT CLASS ARM MODAL -->

    <div id="classArmModal" class="modal-overlay">

        <div class="modal">


            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Class Arm
                </h2>

                <button type="button" class="close-modal" id="closeModalBtn">
                    &times;
                </button>

            </div>


            <form id="classArmForm">


                <div class="modal-body">

                    <div class="form-grid">


                        <div class="form-group full">

                            <label for="classId">
                                Class *
                            </label>

                            <select id="classId" name="classId" required>

                                <option value="">
                                    Select Class
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="armName">
                                Arm Name *
                            </label>

                            <input type="text" id="armName" name="armName" placeholder="e.g. A" required>

                        </div>


                        <div class="form-group">

                            <label for="armCode">
                                Arm Code
                            </label>

                            <input type="text" id="armCode" name="armCode" placeholder="e.g. JSS1-A">

                        </div>


                        <div class="form-group">

                            <label for="capacity">
                                Student Capacity
                            </label>

                            <input type="number" id="capacity" name="capacity" min="1" placeholder="e.g. 40">

                        </div>


                        <div class="form-group">

                            <label for="armStatus">
                                Status
                            </label>

                            <select id="armStatus" name="status">

                                <option value="active">
                                    Active
                                </option>

                                <option value="inactive">
                                    Inactive
                                </option>

                            </select>

                        </div>


                        <div class="form-group full">

                            <label for="description">
                                Description
                            </label>

                            <textarea id="description" name="description"
                                placeholder="Optional description..."></textarea>

                        </div>


                    </div>

                </div>


                <div class="modal-footer">

                    <button type="button" class="btn-secondary" id="cancelModalBtn">
                        Cancel
                    </button>

                    <button type="submit" class="btn-primary" id="saveClassArmBtn">
                        Save Class Arm
                    </button>

                </div>


            </form>


        </div>

    </div>


    <!-- FRONTEND SCRIPT -->

    <script src="../js/class-arms.js"></script>


</body>

</html>
