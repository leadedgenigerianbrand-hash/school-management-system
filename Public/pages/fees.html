<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees Management</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="page-container">

        <div class="page-header">
            <div>
                <h1>Fees Management</h1>
                <p>Manage student fees, payments and outstanding balances.</p>
            </div>

            <button type="button" class="btn btn-primary" id="addFeeButton">
                + Record Fee
            </button>
        </div>


        <div class="stats-grid">

            <div class="stat-card">
                <span>Total Fee Records</span>
                <strong id="totalRecords">0</strong>
            </div>

            <div class="stat-card">
                <span>Total Fees</span>
                <strong id="totalAmount">₦0.00</strong>
            </div>

            <div class="stat-card">
                <span>Total Paid</span>
                <strong id="totalPaid">₦0.00</strong>
            </div>

            <div class="stat-card">
                <span>Total Outstanding</span>
                <strong id="totalBalance">₦0.00</strong>
            </div>

        </div>


        <div class="content-card">

            <div class="toolbar">

                <input type="search" id="searchInput" placeholder="Search student, admission number or fee...">

                <select id="statusFilter">

                    <option value="">
                        All Statuses
                    </option>

                    <option value="paid">
                        Paid
                    </option>

                    <option value="partial">
                        Partial
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="overdue">
                        Overdue
                    </option>

                </select>

                <button type="button" class="btn btn-secondary" id="refreshButton">
                    Refresh
                </button>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Student</th>
                            <th>Admission No.</th>
                            <th>Fee Type</th>
                            <th>Session</th>
                            <th>Term</th>
                            <th>Amount</th>
                            <th>Paid</th>
                            <th>Balance</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="feesTableBody">

                        <tr>
                            <td colspan="10">
                                Loading fee records...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- RECORD FEE MODAL -->

    <div id="feeModal" class="modal" hidden>

        <div class="modal-content">

            <div class="modal-header">

                <h2>Record Student Fee</h2>

                <button type="button" id="closeModalButton" class="close-button">
                    ×
                </button>

            </div>


            <form id="feeForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="studentId">
                            Student ID
                        </label>

                        <input type="number" id="studentId" required>

                    </div>


                    <div class="form-group">

                        <label for="feeType">
                            Fee Type
                        </label>

                        <input type="text" id="feeType" placeholder="School Fees" required>

                    </div>


                    <div class="form-group">

                        <label for="sessionId">
                            Academic Session ID
                        </label>

                        <input type="number" id="sessionId">

                    </div>


                    <div class="form-group">

                        <label for="termId">
                            Term ID
                        </label>

                        <input type="number" id="termId">

                    </div>


                    <div class="form-group">

                        <label for="amount">
                            Amount
                        </label>

                        <input type="number" id="amount" min="0" step="0.01" required>

                    </div>


                    <div class="form-group">

                        <label for="amountPaid">
                            Amount Paid
                        </label>

                        <input type="number" id="amountPaid" min="0" step="0.01" value="0">

                    </div>


                    <div class="form-group full-width">

                        <label for="notes">
                            Notes
                        </label>

                        <textarea id="notes" rows="4" placeholder="Optional notes"></textarea>

                    </div>

                </div>


                <div class="form-actions">

                    <button type="button" class="btn btn-secondary" id="cancelFeeButton">
                        Cancel
                    </button>

                    <button type="submit" class="btn btn-primary">
                        Save Fee
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="../js/fees.js"></script>

</body>

</html>
