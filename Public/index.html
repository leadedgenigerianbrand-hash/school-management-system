<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Professional school management system for managing students, staff, academics, attendance, fees and results.">

    <meta name="theme-color" content="#0d6efd">

    <meta name="color-scheme" content="light">

    <title>School Management System</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">

    <link rel="stylesheet" href="/css/bootstrap-system.css">

    <link rel="stylesheet" href="/css/dashboard.css">

    <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>

    <div id="appLoading" class="app-loading" role="status" aria-live="polite">
        <div class="text-center">
            <div class="spinner-border text-primary mb-3" role="status" aria-hidden="true"></div>

            <p class="mb-0 fw-semibold">
                Loading School Management System...
            </p>
        </div>
    </div>


    <div id="app" class="app" hidden>

        <aside id="sidebar" class="sidebar" data-sidebar aria-label="Application navigation"></aside>


        <div id="sidebarOverlay" class="sidebar-overlay" hidden aria-hidden="true"></div>


        <main class="main-content">

            <header class="top-header">

                <div class="header-left">

                    <button id="sidebarToggle" type="button" class="sidebar-toggle" aria-label="Toggle navigation menu"
                        aria-controls="sidebar" aria-expanded="false">
                        <i class="bi bi-list" aria-hidden="true"></i>
                    </button>


                    <div>
                        <h1 id="pageTitle">
                            Dashboard
                        </h1>

                        <p id="pageSubtitle">
                            Welcome to your school management system
                        </p>
                    </div>

                </div>


                <div class="header-right">

                    <button id="notificationButton" type="button" class="header-button" aria-label="Notifications">
                        <span aria-hidden="true">
                            <i class="bi bi-bell-fill"></i>
                        </span>

                        <span id="notificationCount" class="notification-badge" hidden>
                            0
                        </span>
                    </button>


                    <div class="header-user">

                        <div id="headerUserInitials" class="user-avatar" aria-hidden="true">
                            U
                        </div>

                        <div class="header-user-info">

                            <strong id="headerUserName">
                                User
                            </strong>

                            <span id="headerUserRole">
                                User
                            </span>

                        </div>

                    </div>

                </div>

            </header>


            <section id="pageContent" class="page-content" aria-live="polite">
                <div class="content-loading">

                    <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>

                    <p class="mt-3 mb-0">
                        Loading...
                    </p>

                </div>
            </section>


            <footer class="main-footer">

                <div>
                    <strong>
                        School Management System
                    </strong>

                    <span>
                        &copy;
                        <span id="currentYear"></span>
                    </span>
                </div>

                <span>
                    Secure School Administration Platform
                </span>

            </footer>

        </main>

    </div>


    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>


    <div id="confirmModal" class="modal" hidden>

        <div class="modal-overlay" data-confirm-overlay></div>


        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">

            <div class="modal-header">

                <h2 id="confirmTitle">
                    Confirm Action
                </h2>

                <button type="button" id="confirmClose" class="modal-close" aria-label="Close">
                    ×
                </button>

            </div>


            <div class="modal-body">

                <p id="confirmMessage">
                    Are you sure you want to continue?
                </p>

            </div>


            <div class="modal-footer">

                <button type="button" id="confirmCancel" class="button button-secondary">
                    Cancel
                </button>

                <button type="button" id="confirmProceed" class="button button-danger">
                    Continue
                </button>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/api.js"></script>

    <script src="/js/auth.js"></script>

    <script src="/js/pageGuard.js"></script>

    <script src="/js/sidebar.js"></script>

    <script src="/js/app.js"></script>

</body>

</html>
